{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow p-4">

<h2 class="mb-4 text-center">
Register
</h2>

<form method="POST">

<input type="text"
name="name"
class="form-control mb-3"
placeholder="Name">

<input type="email"
name="email"
class="form-control mb-3"
placeholder="Email">

<input type="password"
name="password"
class="form-control mb-3"
placeholder="Password">

<button class="btn btn-primary w-100">
Register
</button>

</form>

</div>

</div>

</div>

{% endblock %}
