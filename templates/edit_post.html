{% extends 'base.html' %}

{% block content %}

<div class="card shadow p-4">

<h2>Edit Post</h2>

<form method="POST">

<input type="text"
name="title"
value="{{ post.title }}"
class="form-control mb-3">

<textarea name="content"
class="form-control mb-3"
rows="5">{{ post.content }}</textarea>

<button class="btn btn-primary">
Update
</button>

</form>

</div>

{% endblock %}
